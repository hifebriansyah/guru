name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  pull_request: # build and check only, no deploy
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

# Only the site is published (build/client): the teachers' prompts (agents/) and the Worker stay out of it.
# The Kitab texts in abism/ are copied into it by scripts/postbuild.ts: the Worker reads them from <site>/abism/.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run build-storybook # a broken story fails the build; copied to /storybook/ by the next step
      - run: npm run build # the page, 404.html, abism/, sw.js and storybook/ in build/client
      - uses: actions/configure-pages@v6
        if: github.event_name != 'pull_request'
      - uses: actions/upload-pages-artifact@v5
        if: github.event_name != 'pull_request'
        with:
          path: build/client

  deploy:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
