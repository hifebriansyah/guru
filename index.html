<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guru</title>
  <meta name="description" content="Ask one question and hear how different religions answer it.">
  <meta name="theme-color" content="#1b2556">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 48 48'%3E%3Cmask id='m'%3E%3Crect width='48' height='48' fill='%23fff'/%3E%3Cpath d='M24 24 L48 8.5 V24.33 H24 Z' fill='%23000'/%3E%3C/mask%3E%3Cg fill='none' mask='url%28%23m%29'%3E%3Ccircle cx='24' cy='24' r='21.24' stroke='%23233e86' stroke-width='5.52'/%3E%3Ccircle cx='24' cy='24' r='16.05' stroke='%233871a8' stroke-width='4.86'/%3E%3Ccircle cx='24' cy='24' r='10.1' stroke='%23aad9e9' stroke-width='7.1'/%3E%3C/g%3E%3Crect x='23.1' y='24.33' width='8' height='3.02' fill='%23aad9e9'/%3E%3C/svg%3E">
  <style>
    /* Solid cards on soft colour blobs. Palette from the logo, dark to light: #1b2556 #233e86 #3871a8 #2194b8 #77c4cf #aad9e9. */
    :root {
      --page: #eef6fb; --blob1: rgba(170, 217, 233, .9); --blob2: rgba(119, 196, 207, .55); --blob3: rgba(56, 113, 168, .28);
      --surface: #fff; --edge: rgba(27, 37, 86, .08); --shadow: 0 4px 20px rgba(27, 37, 86, .08); --shadow-focus: 0 4px 20px rgba(27, 37, 86, .18);
      --field: #f3f9fc; --line: rgba(27, 37, 86, .1); --seg-on: #fff;
      --text: #1b2556; --muted: #3871a8; --link: #233e86; --focus: #2194b8; --error: #b3261e;
      --button: #2194b8; --button-text: #fff;  /* the same colour as the menu switches */
      /* one colour per teacher, in the order of the rings */
      --r1: #1b2556; --r2: #233e86; --r3: #3871a8; --r4: #2194b8; --r5: #77c4cf; --r6: #aad9e9; --r7: #f2b84b;
    }
    :root[data-theme="dark"] {
      --page: #0a1b22; --blob1: rgba(33, 148, 184, .3); --blob2: rgba(119, 196, 207, .16); --blob3: rgba(56, 113, 168, .24);
      --surface: #12303a; --edge: rgba(170, 217, 233, .1); --shadow: 0 4px 20px rgba(0, 0, 0, .35); --shadow-focus: 0 4px 20px rgba(0, 0, 0, .5);
      --field: #0e2830; --line: rgba(170, 217, 233, .12); --seg-on: rgba(119, 196, 207, .22);
      --text: #e8f4f6; --muted: #8fc9d6; --link: #8fd3e0; --focus: #77c4cf; --error: #f2a097;
      --button: #2194b8; --button-text: #fff;
      --r1: #aad9e9; --r2: #77c4cf; --r3: #5aa6d6; --r4: #2194b8; --r5: #8fb4e8; --r6: #4fb3a9; --r7: #f2b84b;
    }
    * { box-sizing: border-box; }
    /* Scrollbars in the style of macOS: thin, round, no track, a translucent thumb that gets darker when pointed at. */
    * { scrollbar-width: thin; scrollbar-color: color-mix(in srgb, var(--text) 30%, transparent) transparent; }
    @supports selector(::-webkit-scrollbar) {
      * { scrollbar-width: auto; scrollbar-color: auto; }  /* Chrome and Safari take the rules below instead */
      *::-webkit-scrollbar { width: 14px; height: 14px; background: transparent; }
      *::-webkit-scrollbar-track { background: transparent; }
      *::-webkit-scrollbar-corner { background: transparent; }
      *::-webkit-scrollbar-thumb { border: 4px solid transparent; border-radius: 999px; background: color-mix(in srgb, var(--text) 28%, transparent); background-clip: content-box; min-height: 40px; }
      *::-webkit-scrollbar-thumb:hover { background: color-mix(in srgb, var(--text) 50%, transparent); background-clip: content-box; }
    }
    body {
      margin: 0; min-height: 100vh; padding: 24px 16px 32px;
      background: var(--page); color: var(--text);
      font: 16px/1.55 -apple-system, BlinkMacSystemFont, "SF Pro Text", system-ui, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
    }
    /* the colour behind the cards: soft blobs that stay put while the page scrolls */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: -1; pointer-events: none;
      background:
        radial-gradient(40vmax 40vmax at 10% 5%, var(--blob1), transparent 70%),
        radial-gradient(35vmax 35vmax at 95% 30%, var(--blob2), transparent 70%),
        radial-gradient(45vmax 45vmax at 30% 100%, var(--blob3), transparent 70%);
    }
    /* one look for every surface */
    form, .answer, .menu { background: var(--surface); box-shadow: var(--shadow); }  /* no borders: the shadow draws the edge */
    /* Like a search page: before the first question only the logo and the box, in the middle of the screen. After it (body.asked)
       they move to the top and shrink, and the answers come in below. */
    main { width: 100%; max-width: 840px; margin: 0 auto; min-height: calc(100vh - 150px); min-height: calc(100dvh - 150px); display: flex; flex-direction: column; justify-content: center; }
    body.asked main { justify-content: flex-start; min-height: 0; }
    h1 { view-transition-name: logo; }
    form { view-transition-name: box; }
    ::view-transition-group(*) { animation-duration: .5s; animation-timing-function: cubic-bezier(.2, .8, .2, 1); }
    h1 {
      margin: 0 0 28px; display: flex; align-items: center; justify-content: center; gap: .25em;
      font-size: 3.2rem; font-weight: 700; letter-spacing: -.03em; line-height: 1;
    }
    h1 a { display: flex; align-items: center; gap: .25em; color: inherit; text-decoration: none; }
    h1 svg { width: 1.4em; height: 1.4em; flex: none; border-radius: 50%; }
    body.asked h1 { margin-bottom: 16px; font-size: 1.6rem; }
    /* on the dark page the navy outer rings would vanish: the logo sits on a light disc instead */
    /* on dark the logo has no white disc: its rings are lightened so they show on the page */
    :root[data-theme="dark"] h1 .ring1 { stroke: #4f8fcb; }
    :root[data-theme="dark"] h1 .ring2 { stroke: #77c4cf; }
    :root[data-theme="dark"] h1 .ring3 { stroke: #cfeaf3; }
    /* the box: the question grows with its text, the settings and send buttons sit inside on the right */
    form { position: relative; display: flex; align-items: flex-end; gap: 4px; padding: 6px 6px 6px 22px; border-radius: 28px; box-shadow: none; transition: box-shadow .15s; }  /* no shadow until it is focused */
    form:focus-within { box-shadow: var(--shadow-focus); }  /* on focus the same shadow, a bit darker: no border, no wider spread */
    textarea {
      flex: 1; min-width: 0; display: block; max-height: 40vh; margin: 0; padding: 9px 0; border: 0; outline: 0; resize: none; overflow-y: auto;
      background: transparent; color: inherit; font: inherit; line-height: 1.5;
    }
    textarea::placeholder { color: var(--muted); opacity: .7; }
    button { margin: 0; padding: 0; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; }
    button:focus-visible { outline: 0; box-shadow: 0 0 0 5px color-mix(in srgb, var(--focus) 28%, transparent); }  /* keyboard focus: a soft halo, no border */
    button.icon {
      flex: none; width: 42px; height: 42px; display: grid; place-items: center; border-radius: 50%; color: var(--muted); transition: background .15s;
    }
    button.icon:hover, button.icon[aria-expanded="true"] { background: var(--line); }
    button.send { background: var(--button); color: var(--button-text); box-shadow: 0 4px 12px rgba(33, 148, 184, .3); transition: transform .12s, filter .15s, opacity .15s; }
    button.send:hover { background: var(--button); filter: brightness(1.08); }
    button.send:active:not(:disabled) { transform: scale(.94); }
    button:disabled { opacity: .4; cursor: default; box-shadow: none; filter: none; }
    svg.i { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    .menu-wrap { display: contents; }  /* the menu hangs from the whole box, not from the button */
    .menu {
      position: absolute; right: 0; top: calc(100% + 8px); z-index: 10; width: 100%; max-width: 480px; display: grid;  /* as wide as the question box, but at most 480px */ gap: 10px; padding: 12px;
      border-radius: 22px;
    }
    .menu[hidden] { display: none; }
    @media (max-width: 600px) { .menu { max-width: none; } }  /* on a small screen the menu is as wide as the box */
    .menu hr { width: 100%; margin: 0; border: 0; border-top: 1px solid var(--line); }
    .menu button { font-weight: 600; }
    .segs { display: flex; gap: 8px; }  /* theme and language on one line */
    .segs .seg { flex: 1; }
    .seg { display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 4px; padding: 3px; background: var(--line); border-radius: 999px; }
    .seg button { height: 32px; display: grid; place-items: center; border-radius: 999px; color: var(--muted); font-size: .85rem; }
    .seg button svg.i { width: 18px; height: 18px; }
    .seg button[aria-pressed="true"] { background: var(--seg-on); color: var(--text); box-shadow: 0 2px 8px rgba(27, 37, 86, .15); }
    /* the religions are flex items: always two on a line, the name and its switch side by side */
    #teacherRows { display: flex; flex-wrap: wrap; gap: 2px 20px; }
    #teacherRows .row { flex: 0 0 calc((100% - 40px) / 3); min-width: 0; justify-content: flex-start; gap: 8px; padding: 5px 0; font-size: .8rem; }
    @media (max-width: 520px) { #teacherRows .row { flex-basis: calc((100% - 20px) / 2); } }  /* three would cut the names on a small phone */
    .row > label { cursor: pointer; user-select: none; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 5px 2px; font-size: .9rem; }
    .menu .switch { position: relative; flex: none; width: 46px; height: 28px; border-radius: 999px; background: var(--line); transition: background .2s; }
    .switch::after {
      content: ""; position: absolute; top: 2px; left: 2px; width: 24px; height: 24px; border-radius: 50%;
      background: #fff; box-shadow: 0 2px 6px rgba(0, 0, 0, .2); transition: transform .2s;
    }
    .switch[aria-checked="true"] { background: #2194b8; }
    .switch[aria-checked="true"]::after { transform: translateX(18px); }
    .answer { border-radius: 26px; padding: 16px; box-shadow: none; transition: box-shadow .2s; }  /* the shadow only shows on hover */
    .answer:hover { box-shadow: var(--shadow); }
    .note { margin: 14px 8px 0; font-size: .9rem; color: var(--muted); text-align: center; }
    .note:empty { display: none; }
    /* the privacy policy: an icon on the row of the theme and language switchers */
    .menu .policy-btn { flex: none; width: 38px; height: 38px; display: grid; place-items: center; border-radius: 999px; background: var(--line); color: var(--muted); transition: background .2s, box-shadow .2s; }
    .menu .policy-btn svg.i { width: 18px; height: 18px; }
    .menu .policy-btn:hover { background: var(--seg-on); box-shadow: 0 2px 8px rgba(27, 37, 86, .15); }  /* the text stays; the pill lights up like the active switcher */
    dialog.policy { width: min(560px, calc(100vw - 32px)); max-height: min(80vh, 640px); padding: 0; border-radius: 20px; color: var(--text); background: var(--surface); border: 0; box-shadow: 0 8px 24px rgba(0, 0, 0, .18), 0 24px 80px rgba(0, 0, 0, .35); }  /* always shadowed; the backdrop is light enough for it to show */
    dialog.policy[open] { display: flex; flex-direction: column; overflow: hidden; }  /* the head stays, only the body scrolls */
    dialog.policy::backdrop { background: rgba(10, 27, 34, .28); }
    .policy-head { flex: none; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 16px 20px; background: var(--surface); border-bottom: 1px solid var(--line); }
    .policy-head h2 { margin: 0; font-size: 1.1rem; }
    .policy-body { flex: 1; min-height: 0; overflow-y: auto; padding: 4px 20px 20px; font-size: .9rem; line-height: 1.55; }
    .policy-body h3 { margin: 18px 0 4px; font-size: .95rem; }
    .policy-body p { margin: 0; color: var(--muted); }
    .policy-body p + p { margin-top: 8px; }
    .answers { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
    /* each teacher's colour as a small glowing dot before the name */
    .answer { --ring: var(--r1); }
    .answer:nth-child(6n+2) { --ring: var(--r2); }
    .answer:nth-child(6n+3) { --ring: var(--r3); }
    .answer:nth-child(6n+4) { --ring: var(--r4); }
    .answer:nth-child(6n+5) { --ring: var(--r5); }
    .answer:nth-child(6n+6) { --ring: var(--r6); }
    .answer:nth-child(7n+7) { --ring: var(--r7); }
    .answer h2 { margin: 0 0 8px; display: flex; align-items: baseline; gap: 6px; font-size: 1rem; }
    .answer h2::before {
      content: ""; flex: none; align-self: center; width: 10px; height: 10px; border-radius: 50%;
      background: var(--ring); box-shadow: 0 0 0 3px color-mix(in srgb, var(--ring) 25%, transparent);
    }
    .answer h2 small { font-weight: 400; color: var(--muted); }
    .answer a { color: var(--link); font-weight: 600; text-decoration-color: color-mix(in srgb, currentColor 40%, transparent); text-underline-offset: 3px; transition: color .2s; }
    .answer a:hover { color: color-mix(in srgb, var(--link) 65%, #000); }  /* only darker, nothing else changes */
    .answer.waiting h2::before { animation: wait 1.4s ease-in-out infinite; }
    @keyframes wait { 50% { opacity: .3; transform: scale(.7); } }
    /* a card rises in, one after the other, instead of popping up; its text fades in when the answer arrives */
    .answer { animation: card-in .45s cubic-bezier(.2, .8, .2, 1) backwards; }
    .answer:nth-child(2) { animation-delay: .06s; }
    .answer:nth-child(3) { animation-delay: .12s; }
    .answer:nth-child(4) { animation-delay: .18s; }
    .answer:nth-child(5) { animation-delay: .24s; }
    .answer:nth-child(6) { animation-delay: .3s; }
    .answer:not(.waiting) .body { animation: fade-in .35s ease; }
    @keyframes card-in { from { opacity: 0; transform: translateY(12px); } }
    @keyframes fade-in { from { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) { .answer.waiting h2::before, .answer, .answer:not(.waiting) .body { animation: none; } }
    .answer p { margin: 0 0 8px; }
    .answer p:last-child { margin-bottom: 0; }
    .answer.waiting .body { color: var(--muted); font-style: italic; }
    .answer.failed .body { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <h1>
      <a href="./" aria-label="Guru">  <!-- back to the empty page: the folder of this page, also from the address of a question -->
        <!-- the logo (logo.png): three rings, the top-right cut out like a G -->
        <svg viewBox="0 0 48 48" aria-hidden="true">
          <mask id="gcut"><rect width="48" height="48" fill="#fff"/><path d="M24 24 L48 8.5 V24.33 H24 Z" fill="#000"/></mask>
          <g fill="none" mask="url(#gcut)">
            <circle class="ring1" cx="24" cy="24" r="21.24" stroke="#233e86" stroke-width="5.52"/>
            <circle class="ring2" cx="24" cy="24" r="16.05" stroke="#3871a8" stroke-width="4.86"/>
            <circle class="ring3" cx="24" cy="24" r="10.1" stroke="#aad9e9" stroke-width="7.1"/>
          </g>
          <rect x="23.1" y="24.33" width="8" height="3.02" fill="#aad9e9"/>
        </svg>
        Guru
      </a>
    </h1>
    <form id="ask">
      <label for="question" hidden data-t="label">Your question</label>
      <textarea id="question" name="question" rows="1" maxlength="500" required data-tp="placeholder" placeholder="Does heaven exist?"></textarea>
      <div class="menu-wrap">
        <button type="button" class="icon" id="menuBtn" aria-haspopup="true" aria-expanded="false" aria-controls="menu" data-ta="menu" aria-label="Settings">
          <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/></svg>
        </button>
        <div class="menu" id="menu" hidden>
          <div class="segs">
          <div class="seg" role="group" data-ta="theme" aria-label="Theme">
            <button type="button" data-theme-set="light" data-ta="light" aria-label="Light"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg></button>
            <button type="button" data-theme-set="dark" data-ta="dark" aria-label="Dark"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg></button>
          </div>
          <div class="seg" role="group" data-ta="language" aria-label="Language">
            <button type="button" data-lang-set="id">ID</button>
            <button type="button" data-lang-set="en">EN</button>
          </div>
          <button type="button" class="policy-btn" id="policyBtn" data-ta="policyBtn" data-tl="policyBtn" aria-label="Privacy policy"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 13c0 5-3.5 7.5-7.66 8.95a1 1 0 0 1-.67-.01C7.5 20.5 4 18 4 13V6a1 1 0 0 1 1-1c2 0 4.5-1.2 6.24-2.72a1.17 1.17 0 0 1 1.52 0C14.51 3.81 17 5 19 5a1 1 0 0 1 1 1z"/></svg></button>
          <button type="button" class="policy-btn" id="disclaimerBtn" data-ta="disclaimerBtn" data-tl="disclaimerBtn" aria-label="Disclaimer"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="10"/><path d="M12 16v-4"/><path d="M12 8h.01"/></svg></button>
          </div>
          <hr>
          <div id="teacherRows" role="group" data-ta="teachers" aria-label="Teachers"></div>
        </div>
      </div>
      <button type="submit" class="icon send" id="send" data-ta="ask" aria-label="Ask" disabled>
        <svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="m5 12 7-7 7 7"/><path d="M12 19V5"/></svg>
      </button>
    </form>
    <p class="note" id="note" role="status" aria-live="polite"></p>
    <ul class="answers" id="answers" aria-live="polite"></ul>
  </main>
  <dialog class="policy" id="policy" aria-labelledby="policyTitle">
    <div class="policy-head">
      <h2 id="policyTitle" data-t="policyBtn">Privacy policy</h2>
      <button type="button" class="icon" id="policyClose" data-ta="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="policy-body" id="policyBody"></div>
  </dialog>
  <dialog class="policy" id="disclaimer" aria-labelledby="disclaimerTitle">
    <div class="policy-head">
      <h2 id="disclaimerTitle" data-t="disclaimerBtn">Disclaimer</h2>
      <button type="button" class="icon" id="disclaimerClose" data-ta="close" aria-label="Close"><svg class="i" viewBox="0 0 24 24" aria-hidden="true"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
    </div>
    <div class="policy-body" id="disclaimerBody"></div>
  </dialog>
  <script>
    const WORKER_URL = "https://guru-worker.situs.id";
    // The order the answers are shown in; the Worker sends each one as soon as it is ready.
    const TEACHERS = [
      ["islam", "Sheikh", "Islam"], ["protestant", "Pastor", "Protestant"], ["catholic", "Father", "Catholic"],
      ["hinduism", "Acharya", "Hinduism"], ["buddhism", "Bhante", "Buddhism"], ["confucianism", "Laoshi", "Confucianism"], ["abism", "Abi", "Abism"],
    ];
    // The title shown in Indonesian, where it differs from the English one.
    const TITLE_ID = { islam: "Ustadz", protestant: "Pendeta", catholic: "Romo", hinduism: "Acarya" };
    const titleOf = (id, title) => (lang === "id" && TITLE_ID[id]) || title;
    // The name of the tradition shown in Indonesian (the English one is in TEACHERS).
    const TRADITION_ID = { islam: "Islam", protestant: "Protestan", catholic: "Katolik", hinduism: "Hindu", buddhism: "Buddha", confucianism: "Khonghucu", abism: "Abimisme" };
    const traditionOf = (id, tradition) => (lang === "id" && TRADITION_ID[id]) || tradition;

    // Text of the page in both languages. The language is only for the page: the teachers answer in the language of the question.
    const STR = {
      en: {
        intro: "Ask one question and hear how different religions answer it.", label: "Your question", placeholder: "Does heaven exist?", ask: "Ask",
        thinking: "Thinking…", failed: "This teacher could not answer right now.", decline: "As {title}, I can't answer that question.",
        tooMany: "Too many questions. Please wait a minute.", wrong: "Something went wrong.", none: "Switch on at least one teacher in the menu.",
        policyBtn: "Privacy policy", close: "Close", disclaimerBtn: "Disclaimer",
        disclaimer: [
          ["Default Active Gurus", "By default, teachings (the ‑isms) are disabled. This isn't about favouring one group over another; it's simply a practical decision to manage token usage and maintain consistency.\n\nAs the project grows, and we have a larger budget or see greater interest in the teachings (‑isms), we'll certainly reconsider enabling them by default."],
          ["Default Guru Order", "By default, gurus are listed according to their popularity in Indonesia. We may introduce the ability to customise their order in the future."],
          ["Abism", "This teaching is included purely for fun. We understand that it might not be everyone's cup of tea, but we kindly ask you to respect our decision to include it. After all, a little humour never hurts!"],
        ],
        policy: [
          ["What we keep", "Every question you ask and every answer you get is saved on our servers (a log and a database), together with your IP address, country and browser type."],
          ["Why", "To keep the service working, to find mistakes, and to reuse an answer when someone asks the same question again, so we do not have to ask the AI twice."],
          ["Links", "Each question gets its own page address, made from the words of the question. Anyone who has that address can read the question and its answers."],
          ["The AI", "Your question is sent to Google's Gemini models, which write the answers. Please read Google's own policy for how it handles what it receives."],
          ["Your device", "This page has no accounts and sets no tracking cookies. Your browser remembers only your choices (theme, language, which teachers are on)."],
          ["Please", "Do not put personal details in your question (your name, address, phone number, health or family details). Questions are saved and may be reused."],
        ],
        menu: "Settings", theme: "Theme", light: "Light", dark: "Dark", language: "Language", teachers: "Teachers",
        description: "Ask one question and hear how different religions answer it.",
      },
      id: {
        intro: "Ajukan satu pertanyaan dan dengarkan bagaimana berbagai agama menjawabnya.", label: "Pertanyaanmu", placeholder: "apa surga itu ada?", ask: "Tanya",
        thinking: "Sedang berpikir…", failed: "Guru ini belum bisa menjawab sekarang.", decline: "Sebagai {title}, saya tidak dapat menjawab pertanyaan itu.",
        tooMany: "Terlalu banyak pertanyaan. Tunggu semenit.", wrong: "Terjadi kesalahan.", none: "Aktifkan setidaknya satu guru di menu.",
        policyBtn: "Kebijakan privasi", close: "Tutup", disclaimerBtn: "Penafian",
        disclaimer: [
          ["Guru Aktif Bawaan", "Secara bawaan, ajaran (yang berakhiran ‑isme) dinonaktifkan. Ini bukan soal memihak satu kelompok dibanding yang lain, melainkan keputusan praktis untuk mengatur penggunaan token dan menjaga konsistensi.\n\nSeiring proyek ini berkembang, dan ketika anggaran kami lebih besar atau minat pada ajaran (‑isme) meningkat, kami pasti akan mempertimbangkan kembali untuk mengaktifkannya secara bawaan."],
          ["Urutan Guru Bawaan", "Secara bawaan, guru ditampilkan menurut popularitasnya di Indonesia. Kami mungkin menghadirkan kemampuan untuk mengatur urutannya di masa depan."],
          ["Abimisme", "Ajaran ini disertakan murni untuk bersenang-senang. Kami paham ini mungkin bukan selera semua orang, tetapi kami mohon kamu menghargai keputusan kami memasukkannya. Lagi pula, sedikit humor tidak pernah merugikan!"],
        ],
        policy: [
          ["Yang kami simpan", "Setiap pertanyaan dan jawaban disimpan di server kami (log dan basis data), bersama alamat IP, negara, dan jenis peramban kamu."],
          ["Untuk apa", "Agar layanan tetap berjalan, untuk menemukan kesalahan, dan untuk memakai ulang jawaban bila ada yang menanyakan hal yang sama, sehingga AI tidak perlu ditanya dua kali."],
          ["Tautan", "Setiap pertanyaan punya alamat halaman sendiri yang dibuat dari kata-kata pertanyaannya. Siapa pun yang punya alamat itu bisa membaca pertanyaan dan jawabannya."],
          ["AI", "Pertanyaanmu dikirim ke model Gemini milik Google yang menulis jawabannya. Baca kebijakan Google sendiri untuk tahu bagaimana data itu diperlakukan."],
          ["Perangkatmu", "Halaman ini tidak punya akun dan tidak memasang cookie pelacak. Peramban hanya mengingat pilihanmu (tema, bahasa, guru mana yang aktif)."],
          ["Mohon", "Jangan menulis data pribadi dalam pertanyaan (nama, alamat, nomor telepon, data kesehatan atau keluarga). Pertanyaan disimpan dan bisa dipakai ulang."],
        ],
        menu: "Pengaturan", theme: "Tema", light: "Terang", dark: "Gelap", language: "Bahasa", teachers: "Guru",
        description: "Ajukan satu pertanyaan dan dengarkan bagaimana berbagai agama menjawabnya.",
      },
    };

    const root = document.documentElement;
    const store = {
      get(k) { try { return localStorage.getItem(k); } catch { return null; } },
      set(k, v) { try { localStorage.setItem(k, v); } catch {} },
    };
    // Saved choices, else the system's: light/dark from the system, ID when the browser is Indonesian, every teacher on.
    let lang = store.get("guru-lang") || ((navigator.language || "").toLowerCase().startsWith("id") ? "id" : "en");
    let off = new Set((() => { try { return JSON.parse(store.get("guru-off") || "[]"); } catch { return []; } })());
    // Teachers that start switched off. One that the visitor has never seen (not in guru-known) starts off, also for someone with saved choices.
    const OFF_AT_FIRST = ["abism"];
    const known = (() => { try { return new Set(JSON.parse(store.get("guru-known") || "[]")); } catch { return new Set(); } })();
    for (const id of OFF_AT_FIRST) if (!known.has(id)) off.add(id);
    store.set("guru-off", JSON.stringify([...off]));
    store.set("guru-known", JSON.stringify(TEACHERS.map((t) => t[0])));
    const enabledIds = () => TEACHERS.map((t) => t[0]).filter((id) => !off.has(id));

    const menu = document.getElementById("menu");
    const menuBtn = document.getElementById("menuBtn");
    const teacherRows = document.getElementById("teacherRows");
    const policy = document.getElementById("policy"), policyBody = document.getElementById("policyBody");
    const disclaimer = document.getElementById("disclaimer"), disclaimerBody = document.getElementById("disclaimerBody");

    function applyTheme(theme) {
      root.dataset.theme = theme;
      for (const b of menu.querySelectorAll("[data-theme-set]")) b.setAttribute("aria-pressed", String(b.dataset.themeSet === theme));
    }
    function applyLang(next) {
      lang = next;
      const s = STR[lang];
      root.lang = lang;
      for (const el of document.querySelectorAll("[data-t]")) el.textContent = s[el.dataset.t];
      for (const el of document.querySelectorAll("[data-tp]")) el.placeholder = s[el.dataset.tp];
      for (const el of document.querySelectorAll("[data-ta]")) el.setAttribute("aria-label", s[el.dataset.ta]);
      for (const el of document.querySelectorAll("[data-tl]")) el.title = s[el.dataset.tl];  // a tooltip for an icon without a word
      document.querySelector('meta[name="description"]').content = s.description;
      for (const b of menu.querySelectorAll("[data-lang-set]")) b.setAttribute("aria-pressed", String(b.dataset.langSet === lang));
      for (const [box, sections] of [[policyBody, s.policy], [disclaimerBody, s.disclaimer]]) box.replaceChildren(...sections.flatMap(([h, text]) => {
        const hh = document.createElement("h3");
        hh.textContent = h;
        return [hh, ...text.split("\n\n").map((para) => Object.assign(document.createElement("p"), { textContent: para }))];  // a blank line starts a new paragraph
      }));
      for (const [id, , tradition] of TEACHERS) {  // the teacher rows of the menu
        const name = traditionOf(id, tradition);
        teacherRows.querySelector(`[data-tid="${id}"]`).textContent = name;
        teacherRows.querySelector(`[data-sid="${id}"]`).setAttribute("aria-label", name);
      }
      for (const li of document.querySelectorAll("#answers [data-tid]")) {  // the cards already on the page
        const [id, title, tradition] = TEACHERS.find((t) => t[0] === li.dataset.tid);
        heading(li.querySelector("h2"), id, title, tradition);
        const body = li.querySelector(".body");
        if (li.classList.contains("waiting")) body.textContent = s.thinking;
        else if (li.classList.contains("failed")) body.textContent = s.failed;
        else if (li.dataset.decline !== undefined) body.textContent = (li.dataset.decline || s.decline).replace("{title}", titleOf(id, title));
      }
    }

    for (const [id, , tradition] of TEACHERS) {
      const row = document.createElement("div");
      row.className = "row";
      const label = document.createElement("label");  // a click on the name works the switch
      label.dataset.tid = id;
      label.htmlFor = `sw-${id}`;
      const sw = document.createElement("button");
      sw.type = "button";
      sw.className = "switch";
      sw.setAttribute("role", "switch");
      sw.dataset.sid = id;
      sw.id = `sw-${id}`;
      sw.setAttribute("aria-checked", String(!off.has(id)));
      sw.addEventListener("click", () => {
        if (off.has(id)) off.delete(id); else off.add(id);
        sw.setAttribute("aria-checked", String(!off.has(id)));
        store.set("guru-off", JSON.stringify([...off]));
        if (off.has(id)) dropCard(id); else addCard(id);  // a question that is on the page follows the switch
      });
      row.append(sw, label);  // the switch first, then the name
      teacherRows.append(row);
    }

    menu.addEventListener("click", (e) => {
      const t = e.target.closest("button");
      if (!t) return;
      if (t.dataset.themeSet) { applyTheme(t.dataset.themeSet); store.set("guru-theme", t.dataset.themeSet); }
      if (t.dataset.langSet) { applyLang(t.dataset.langSet); store.set("guru-lang", t.dataset.langSet); }
    });
    document.getElementById("policyBtn").addEventListener("click", () => { setMenu(false); policy.showModal(); });
    document.getElementById("policyClose").addEventListener("click", () => policy.close());
    policy.addEventListener("click", (e) => { if (e.target === policy) policy.close(); });  // a click on the backdrop
    document.getElementById("disclaimerBtn").addEventListener("click", () => { setMenu(false); disclaimer.showModal(); });
    document.getElementById("disclaimerClose").addEventListener("click", () => disclaimer.close());
    disclaimer.addEventListener("click", (e) => { if (e.target === disclaimer) disclaimer.close(); });
    const setMenu = (open) => { menu.hidden = !open; menuBtn.setAttribute("aria-expanded", String(open)); };
    menuBtn.addEventListener("click", () => setMenu(menu.hidden));
    document.addEventListener("click", (e) => { if (!menu.hidden && !e.target.closest(".menu-wrap")) setMenu(false); });
    document.addEventListener("keydown", (e) => { if (e.key === "Escape" && !menu.hidden) { setMenu(false); menuBtn.focus(); } });
    applyTheme(store.get("guru-theme") || "light");
    applyLang(lang);
    const openSlug = decodeURIComponent(location.pathname.split("/").pop());
    if (openSlug && openSlug !== "index.html") openSaved(openSlug);

    const form = document.getElementById("ask");
    const question = document.getElementById("question");
    const send = document.getElementById("send");
    const note = document.getElementById("note");
    const list = document.getElementById("answers");
    // The box grows with the question (up to 40% of the screen, then it scrolls). Enter sends, Shift+Enter starts a new line.
    const grow = () => { question.style.height = "auto"; question.style.height = question.scrollHeight + "px"; };
    question.addEventListener("input", () => { send.disabled = !question.value.trim(); grow(); });
    question.addEventListener("keydown", (e) => {
      if (e.key === "Enter" && !e.shiftKey && !e.isComposing) { e.preventDefault(); if (!send.disabled) form.requestSubmit(); }
    });

    // The teachers never write addresses: they write citation tags like [[quran 2:286]] and this builds the link, only when the tag
    // has exactly the expected shape. Anything else stays plain text, so a made-up reference can never become a made-up link.
    const SURAH_SLUGS = "al-fatihah al-baqarah ali-imran an-nisa al-maidah al-anam al-araf al-anfal at-taubah yunus hud yusuf ar-rad ibrahim al-hijr an-nahl al-isra al-kahf maryam thaha al-anbiya al-hajj al-muminun an-nur al-furqan asy-syuara an-naml al-qashash al-ankabut ar-rum luqman as-sajdah al-ahzab saba fathir yasin ash-shaffat shad az-zumar ghafir fushshilat asy-syura az-zukhruf ad-dukhan al-jatsiyah al-ahqaf muhammad al-fath al-hujurat qaf adz-dzariyat at-thur an-najm al-qamar ar-rahman al-waqiah al-hadid al-mujadilah al-hasyr al-mumtahanah ash-shaff al-jumuah al-munafiqun at-taghabun at-thalaq at-tahrim al-mulk al-qalam al-haqqah al-maarij nuh al-jinn al-muzzammil al-muddatstsir al-qiyamah al-insan al-mursalat an-naba an-naziat abasa at-takwir al-infithar al-muthaffifin al-insyiqaq al-buruj at-thariq al-ala al-ghasyiyah al-fajr al-balad asy-syams al-lail adh-dhuha al-insyirah at-tin al-alaq al-qadr al-bayyinah az-zalzalah al-adiyat al-qariah at-takatsur al-ashr al-humazah al-fil quraisy al-maun al-kautsar al-kafirun an-nashr al-lahab al-ikhlash al-falaq an-nas".split(" ");
    const ANALECTS = "xue-er wei-zheng ba-yi li-ren gong-ye-chang yong-ye shu-er tai-bo zi-han xiang-dang xian-jin yan-yuan zi-lu xian-wen wei-ling-gong ji-shi yang-huo wei-zi zi-zhang yao-yue".split(" ");
    const REFS = {
      // Quran: our own site, the surah page at the verse
      quran: (a) => { const m = /^(\d{1,3}):(\d{1,3})(?:[-–]\d{1,3})?$/.exec(a); const s = m && SURAH_SLUGS[m[1] - 1];
        return s && [`https://quran.situs.id/${lang}/${s}#ayat-${m[2]}`, "Quran " + a]; },
      // Bible (Protestant and Catholic): the passage on BibleGateway, book in English
      bible: (a) => /^[1-3]? ?[A-Za-z][A-Za-z ]{1,24} \d{1,3}(?::\d{1,3}(?:[-–]\d{1,3})?)?$/.test(a) &&
        [`https://www.biblegateway.com/passage/?search=${encodeURIComponent(a)}`, a],
      // Catechism of the Catholic Church paragraph
      ccc: (a) => /^\d{1,4}$/.test(a) && [`https://www.scborromeo.org/ccc/para/${a}.htm`, "CCC " + a],
      // Bhagavad Gita chapter.verse
      gita: (a) => { const m = /^(\d{1,2})\.(\d{1,3})(?:[-–]\d{1,3})?$/.exec(a); return m && [`https://www.holy-bhagavad-gita.org/chapter/${m[1]}/verse/${m[2]}`, "Bhagavad Gita " + a]; },
      // Pali suttas on SuttaCentral: dn22, mn10, sn56.11, an3.65, snp1.8, ud1.10, iti27
      sutta: (a) => { const m = /^(dn|mn|sn|an|snp|ud|iti)(\d{1,3}(?:\.\d{1,3})?)$/i.exec(a);
        return m && [`https://suttacentral.net/${a.toLowerCase()}`, `${m[1].toUpperCase()} ${m[2]}`]; },
      // Abimisme (Kitab Nasihat Bapak Bapak) jilid:bab:bait: the verse on abimisme.situs.id
      abism: (a) => { const m = /^(\d{1,2}):(\d{1,2}):(\d{1,2})$/.exec(a); return m && [`https://abimisme.situs.id/kitab/${m[1]}/${m[2]}/${m[3]}`, "Kitab " + a]; },
      // Analects book.chapter: the book's page on Chinese Text Project, with the English translation
      analects: (a) => { const m = /^(\d{1,2})\.\d{1,2}$/.exec(a); const s = m && ANALECTS[m[1] - 1];
        return s && [`https://ctext.org/analects/${s}/ens`, "Analects " + a]; },
    };
    function cite(tag, arg) {
      const hit = REFS[tag.toLowerCase()]?.(arg.trim());
      return hit ? `<a href="${hit[0]}" target="_blank" rel="noopener noreferrer">${hit[1]}</a>` : arg.trim();
    }

    // Plain text from the model -> safe HTML: escape everything, then allow **bold**, *italics*, citation links and paragraphs.
    function render(text) {
      const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return esc.split(/\n{2,}/).map((p) => "<p>" + p
        .replace(/\[\[(\w+)\s+([^\]]{1,40})\]\]/g, (_, tag, arg) => cite(tag, arg))
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\n/g, "<br>") + "</p>").join("");
    }

    // One card, the same for every teacher and for the screener.
    function heading(h, id, title, tradition) {
      h.replaceChildren(titleOf(id, title) + " ");
      if (tradition) {
        const small = document.createElement("small");
        small.textContent = "· " + traditionOf(id, tradition);
        h.append(small);
      }
    }

    // A teacher's card (id given) is labelled again when the language is switched; the screener's has no id.
    function card(id, title, tradition, text) {
      const li = document.createElement("li");
      li.className = "answer waiting";
      const h = document.createElement("h2");
      if (id) li.dataset.tid = id;
      heading(h, id, title, tradition);
      const body = document.createElement("div");
      body.className = "body";
      body.textContent = text;
      li.append(h, body);
      list.append(li);
      return li;
    }

    function cards() {
      list.replaceChildren();
      const byId = {};
      for (const [id, title, tradition] of TEACHERS) if (!off.has(id)) byId[id] = card(id, title, tradition, STR[lang].thinking);
      return byId;
    }

    // The first question moves the logo and the box from the middle of the screen to the top. The View Transitions API animates that
    // move (both are named in the CSS); where it is missing, or motion is reduced, the page just jumps.
    // The address of a question is the page's folder plus its slug (guru.situs.id/apa-surga-itu-ada). No page reload: only the address bar changes.
    const folder = () => location.pathname.replace(/[^/]*$/, "");
    function setAddress(slug) {
      const to = folder() + encodeURIComponent(slug);
      if (location.pathname !== to) history.pushState(null, "", to);
    }

    // An address with a slug shows what is saved for it (GET /answer/<slug> on the Worker), without asking any teacher again.
    async function openSaved(slug) {
      try {
        const res = await fetch(`${WORKER_URL}/answer/${encodeURIComponent(slug)}`);
        if (!res.ok) throw new Error("not found");
        const data = await res.json();
        const items = [];
        if (data.outOfScope && data.message) items.push(["", "Screener", "", data.message]);
        else for (const [id, title, tradition] of TEACHERS) if (data.answers[id] && !off.has(id)) items.push([id, title, tradition, data.answers[id]]);
        if (!items.length) throw new Error("nothing saved");
        question.value = data.question;
        question.dispatchEvent(new Event("input"));
        document.body.classList.add("asked");
        list.replaceChildren();
        const byId = {};
        for (const [id, title, tradition, text] of items) {
          const li = card(id, title, tradition, "");
          if (id) byId[id] = li;
          li.classList.remove("waiting");
          if (id) li.querySelector(".body").innerHTML = render(text);
          else li.querySelector(".body").textContent = text;
        }
        shown = { q: data.question, byId, outOfScope: !items[0][0] };  // so a teacher switched on later gets a card here too
      } catch {
        history.replaceState(null, "", folder());  // an address nobody saved: back to the empty page
      }
    }
    addEventListener("popstate", () => location.reload());  // back/forward between questions

    function showAsked() {
      if (document.body.classList.contains("asked")) return;
      const go = () => document.body.classList.add("asked");
      if (document.startViewTransition && !matchMedia("(prefers-reduced-motion: reduce)").matches) document.startViewTransition(go);
      else go();
    }

    // What is on the page now: the question and its cards (teacher id -> card). Switching a teacher on in the menu adds that teacher's card to it.
    let shown = null;

    // Handles one line of the Worker's answer for the cards in byId. addOn: one more teacher asked about a question that is already shown.
    function makeFill(byId, addOn) {
      return (line) => {
        if (line.id === "screener") {
          if (line.slug) setAddress(line.slug);
          // The screener decides first: keep only the teachers who can answer, or show why none can.
          if (line.outOfScope) {
            if (addOn) return;  // the cards already shown stay; the card of the added teacher is dropped by the caller
            if (shown) shown.outOfScope = true;
            // No teacher can answer: the screener's own card, in the same look as the teachers' (not the note under the form).
            list.replaceChildren();
            const li = card("", "Screener", "", line.message);
            li.classList.remove("waiting");
          } else if (line.religions) {
            for (const [id, title] of TEACHERS) {
              if (line.religions.includes(id) || !byId[id]) continue;
              const li = byId[id];
              if (addOn && !li.classList.contains("waiting")) continue;  // this request was only about the added teacher: the cards already answered stay as they are
              li.classList.remove("waiting");
              li.dataset.decline = line.decline || "";  // kept so the title in it can follow a language switch
              li.querySelector(".body").textContent = (line.decline || STR[lang].decline).replace("{title}", titleOf(id, title));
            }
          }
          return;
        }
        const li = byId[line.id];
        if (!li) return;
        const body = li.querySelector(".body");
        li.classList.remove("waiting");
        if (line.answer) body.innerHTML = render(line.answer);
        else { li.classList.add("failed"); body.textContent = STR[lang].failed; }
      };
    }

    // POST /ask and hand every line of the streamed answer to fill.
    async function readAnswer(q, teachers, fill) {
      const res = await fetch(WORKER_URL + "/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q, teachers }) });
      if (!res.ok) {
        const err = await res.json().catch(() => ({}));
        throw new Error(res.status === 429 ? STR[lang].tooMany : err.error || STR[lang].wrong);
      }
      const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
      let buffer = "";
      for (;;) {
        const { value, done } = await reader.read();
        if (done) break;
        buffer += value;
        const lines = buffer.split("\n");
        buffer = lines.pop();
        for (const l of lines) if (l.trim()) fill(JSON.parse(l));
      }
      if (buffer.trim()) fill(JSON.parse(buffer));
    }

    // A teacher is switched on while a question is shown: its card appears in its place among the others, and only that teacher is asked
    // (an answer already saved for this question comes straight from the database).
    async function addCard(id) {
      if (!shown || shown.outOfScope || shown.byId[id]) return;
      const at = TEACHERS.findIndex((t) => t[0] === id);
      const [, title, tradition] = TEACHERS[at];
      const li = card(id, title, tradition, STR[lang].thinking);
      const later = [...list.children].find((c) => TEACHERS.findIndex((t) => t[0] === c.dataset.tid) > at);  // keep the order of the teachers
      if (later) list.insertBefore(li, later);
      note.textContent = "";
      const mine = shown;
      mine.byId[id] = li;
      const fill = makeFill(mine.byId, true);
      let screenedOut = false;
      try {
        await readAnswer(mine.q, [id], (line) => { if (line.outOfScope) screenedOut = true; fill(line); });
        if (screenedOut) { li.remove(); delete mine.byId[id]; return; }
        if (li.classList.contains("waiting")) fill({ id });  // no line came for it
      } catch {
        li.classList.remove("waiting");
        li.classList.add("failed");
        li.querySelector(".body").textContent = STR[lang].failed;
      }
    }

    // A teacher is switched off: its card goes.
    function dropCard(id) {
      shown?.byId[id]?.remove();
      if (shown) delete shown.byId[id];
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = question.value.trim();
      if (!q) return;
      showAsked();
      note.textContent = "";
      const teachers = enabledIds();
      shown = { q, byId: {}, outOfScope: false };
      if (!teachers.length) { list.replaceChildren(); note.textContent = STR[lang].none; return; }
      send.disabled = true;
      const byId = cards();
      shown.byId = byId;
      const fill = makeFill(byId, false);
      try {
        await readAnswer(q, teachers, fill);
        for (const li of list.querySelectorAll(".waiting")) fill({ id: Object.keys(byId).find((k) => byId[k] === li) });
      } catch (err) {
        list.replaceChildren();
        shown = null;
        note.textContent = err.message || STR[lang].wrong;
      } finally {
        send.disabled = !question.value.trim();
      }
    });
  </script>
</body>
</html>
