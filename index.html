<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Guru</title>
  <meta name="description" content="Ask one question and hear how six religious traditions answer it.">
  <style>
    :root {
      --bg: #f6f3ee; --card: #fffdf9; --text: #2b2723; --muted: #6f675e; --line: #ded6cb;
      --accent: #7a5c3e; --accent-text: #fff; --error: #a23b2a;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #171513; --card: #211e1b; --text: #eee8e1; --muted: #a59c91; --line: #3a352f; --accent: #c9a27c; --accent-text: #1b1714; --error: #e58a78; }
    }
    :root[data-theme="dark"] { --bg: #171513; --card: #211e1b; --text: #eee8e1; --muted: #a59c91; --line: #3a352f; --accent: #c9a27c; --accent-text: #1b1714; --error: #e58a78; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; padding: 48px 16px;
      background: var(--bg); color: var(--text); font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    main { width: 100%; max-width: 680px; margin: 0 auto; }
    header { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-bottom: 4px; }
    h1 { margin: 0; font-size: 1.6rem; }
    button.theme {
      margin: 0; width: 40px; height: 40px; padding: 0; display: grid; place-items: center;
      background: transparent; color: var(--text); border: 1px solid var(--line); border-radius: 10px;
    }
    button.theme svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    button.theme .sun, :root[data-theme="dark"] button.theme .moon { display: none; }
    :root[data-theme="dark"] button.theme .sun { display: block; }
    .intro { margin: 0 0 20px; color: var(--muted); }
    form, .answer { background: var(--card); border: 1px solid var(--line); border-radius: 14px; padding: 16px; }
    textarea {
      width: 100%; min-height: 120px; resize: vertical; padding: 12px; border: 1px solid var(--line); border-radius: 10px;
      background: var(--bg); color: inherit; font: inherit;
    }
    textarea:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    button {
      margin-top: 12px; width: 100%; padding: 12px; border: 0; border-radius: 10px; cursor: pointer;
      background: var(--accent); color: var(--accent-text); font: inherit; font-weight: 600;
    }
    button:disabled { opacity: .5; cursor: default; }
    .note { margin: 12px 0 0; font-size: .9rem; color: var(--muted); }
    .note:empty { display: none; }
    .privacy { margin: 10px 4px 0; font-size: .8rem; color: var(--muted); }
    .answers { list-style: none; margin: 20px 0 0; padding: 0; display: grid; gap: 12px; }
    .answer h2 { margin: 0 0 8px; font-size: 1rem; }
    .answer h2 small { font-weight: 400; color: var(--muted); }
    .answer a { color: var(--accent); text-underline-offset: 2px; }
    .answer p { margin: 0 0 8px; }
    .answer p:last-child { margin-bottom: 0; }
    .answer.waiting .body { color: var(--muted); font-style: italic; }
    .answer.failed .body { color: var(--error); }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Guru</h1>
      <button type="button" class="theme" id="theme" aria-label="Switch between light and dark mode">
        <svg class="moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>
        <svg class="sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>
      </button>
    </header>
    <p class="intro">Ask one question and hear how six religious traditions answer it.</p>
    <form id="ask">
      <label for="question" hidden>Your question</label>
      <textarea id="question" name="question" maxlength="500" required placeholder="What does my faith say about forgiveness?"></textarea>
      <button type="submit" id="send" disabled>Ask</button>
      <p class="note" id="note" role="status" aria-live="polite"></p>
    </form>
    <p class="privacy">Questions and answers are kept in our log to keep the service working well. Please don't include personal details.</p>
    <ul class="answers" id="answers" aria-live="polite"></ul>
  </main>
  <script>
    const WORKER_URL = "https://guru-worker.situs.id";
    // The order the answers are shown in; the Worker sends each one as soon as it is ready.
    const TEACHERS = [
      ["islam", "Ustadz", "Islam"], ["protestant", "Pastor", "Protestant Christianity"], ["catholic", "Father", "Catholic"],
      ["hinduism", "Acharya", "Hinduism"], ["buddhism", "Bhante", "Buddhism"], ["confucianism", "Laoshi", "Confucianism"],
    ];

    // Light/dark: the saved choice, else the system's; the button flips it and remembers it.
    const root = document.documentElement;
    let saved = null;
    try { saved = localStorage.getItem("guru-theme"); } catch {}
    root.dataset.theme = saved || (matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
    document.getElementById("theme").addEventListener("click", () => {
      root.dataset.theme = root.dataset.theme === "dark" ? "light" : "dark";
      try { localStorage.setItem("guru-theme", root.dataset.theme); } catch {}
    });

    const form = document.getElementById("ask");
    const question = document.getElementById("question");
    const send = document.getElementById("send");
    const note = document.getElementById("note");
    const list = document.getElementById("answers");
    question.addEventListener("input", () => { send.disabled = !question.value.trim(); });

    // The teachers never write addresses: they write citation tags like [[quran 2:286]] and this builds the link, only when the tag
    // has exactly the expected shape. Anything else stays plain text, so a made-up reference can never become a made-up link.
    const SURAH_SLUGS = "al-fatihah al-baqarah ali-imran an-nisa al-maidah al-anam al-araf al-anfal at-taubah yunus hud yusuf ar-rad ibrahim al-hijr an-nahl al-isra al-kahf maryam thaha al-anbiya al-hajj al-muminun an-nur al-furqan asy-syuara an-naml al-qashash al-ankabut ar-rum luqman as-sajdah al-ahzab saba fathir yasin ash-shaffat shad az-zumar ghafir fushshilat asy-syura az-zukhruf ad-dukhan al-jatsiyah al-ahqaf muhammad al-fath al-hujurat qaf adz-dzariyat at-thur an-najm al-qamar ar-rahman al-waqiah al-hadid al-mujadilah al-hasyr al-mumtahanah ash-shaff al-jumuah al-munafiqun at-taghabun at-thalaq at-tahrim al-mulk al-qalam al-haqqah al-maarij nuh al-jinn al-muzzammil al-muddatstsir al-qiyamah al-insan al-mursalat an-naba an-naziat abasa at-takwir al-infithar al-muthaffifin al-insyiqaq al-buruj at-thariq al-ala al-ghasyiyah al-fajr al-balad asy-syams al-lail adh-dhuha al-insyirah at-tin al-alaq al-qadr al-bayyinah az-zalzalah al-adiyat al-qariah at-takatsur al-ashr al-humazah al-fil quraisy al-maun al-kautsar al-kafirun an-nashr al-lahab al-ikhlash al-falaq an-nas".split(" ");
    const ANALECTS = "xue-er wei-zheng ba-yi li-ren gong-ye-chang yong-ye shu-er tai-bo zi-han xiang-dang xian-jin yan-yuan zi-lu xian-wen wei-ling-gong ji-shi yang-huo wei-zi zi-zhang yao-yue".split(" ");
    let answerLang = "en";  // "id" or "en", from the screener: the language of the question (Quran pages exist in both)
    const REFS = {
      // Quran: our own site, the surah page at the verse
      quran: (a) => { const m = /^(\d{1,3}):(\d{1,3})(?:[-–]\d{1,3})?$/.exec(a); const s = m && SURAH_SLUGS[m[1] - 1];
        return s && [`https://quran.situs.id/${answerLang}/${s}#ayat-${m[2]}`, "Quran " + a]; },
      // Bible (Protestant and Catholic): the passage on BibleGateway, book in English
      bible: (a) => /^[1-3]? ?[A-Za-z][A-Za-z ]{1,24} \d{1,3}(?::\d{1,3}(?:[-–]\d{1,3})?)?$/.test(a) &&
        [`https://www.biblegateway.com/passage/?search=${encodeURIComponent(a)}`, a],
      // Catechism of the Catholic Church paragraph
      ccc: (a) => /^\d{1,4}$/.test(a) && [`https://www.scborromeo.org/ccc/para/${a}.htm`, "CCC " + a],
      // Bhagavad Gita chapter.verse
      gita: (a) => { const m = /^(\d{1,2})\.(\d{1,3})(?:[-–]\d{1,3})?$/.exec(a); return m && [`https://www.holy-bhagavad-gita.org/chapter/${m[1]}/verse/${m[2]}`, "Bhagavad Gita " + a]; },
      // Pali suttas on SuttaCentral: dn22, mn10, sn56.11, an3.65, snp1.8, ud1.10, iti27
      sutta: (a) => { const m = /^(dn|mn|sn|an|snp|ud|iti)(\d{1,3}(?:\.\d{1,3})?)$/i.exec(a);
        return m && [`https://suttacentral.net/${a.toLowerCase()}`, `${m[1].toUpperCase()} ${m[2]}`]; },
      // Analects book.chapter: the book's page on Chinese Text Project, with the English translation
      analects: (a) => { const m = /^(\d{1,2})\.\d{1,2}$/.exec(a); const s = m && ANALECTS[m[1] - 1];
        return s && [`https://ctext.org/analects/${s}/ens`, "Analects " + a]; },
    };
    function cite(tag, arg) {
      const hit = REFS[tag.toLowerCase()]?.(arg.trim());
      return hit ? `<a href="${hit[0]}" target="_blank" rel="noopener noreferrer">${hit[1]}</a>` : arg.trim();
    }

    // Plain text from the model -> safe HTML: escape everything, then allow **bold**, *italics*, citation links and paragraphs.
    function render(text) {
      const esc = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
      return esc.split(/\n{2,}/).map((p) => "<p>" + p
        .replace(/\[\[(\w+)\s+([^\]]{1,40})\]\]/g, (_, tag, arg) => cite(tag, arg))
        .replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\*(.+?)\*/g, "<em>$1</em>").replace(/\n/g, "<br>") + "</p>").join("");
    }

    function cards() {
      list.replaceChildren();
      const byId = {};
      for (const [id, title, tradition] of TEACHERS) {
        const li = document.createElement("li");
        li.className = "answer waiting";
        const h = document.createElement("h2");
        h.append(title + " ");
        const small = document.createElement("small");
        small.textContent = "· " + tradition;
        h.append(small);
        const body = document.createElement("div");
        body.className = "body";
        body.textContent = "Thinking…";
        li.append(h, body);
        list.append(li);
        byId[id] = li;
      }
      return byId;
    }

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const q = question.value.trim();
      if (!q) return;
      send.disabled = true;
      note.textContent = "";
      const byId = cards();
      const fill = (line) => {
        if (line.id === "screener") {
          if (line.lang === "id") answerLang = "id";
          else if (line.lang) answerLang = "en";
          // The screener decides first: keep only the teachers who can answer, or show why none can.
          if (line.outOfScope) {
            list.replaceChildren();
            note.textContent = line.message;
          } else if (line.religions) {
            for (const [id, title] of TEACHERS) {
              if (line.religions.includes(id)) continue;
              const li = byId[id];
              li.classList.remove("waiting");
              li.querySelector(".body").textContent = (line.decline || "As {title}, I can't answer that question.").replace("{title}", title);
            }
          }
          return;
        }
        const li = byId[line.id];
        if (!li) return;
        const body = li.querySelector(".body");
        li.classList.remove("waiting");
        if (line.answer) body.innerHTML = render(line.answer);
        else { li.classList.add("failed"); body.textContent = "This teacher could not answer right now."; }
      };
      try {
        const res = await fetch(WORKER_URL + "/ask", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ question: q }) });
        if (!res.ok) {
          const err = await res.json().catch(() => ({}));
          throw new Error(res.status === 429 ? "Too many questions. Please wait a minute." : err.error || "Something went wrong.");
        }
        const reader = res.body.pipeThrough(new TextDecoderStream()).getReader();
        let buffer = "";
        for (;;) {
          const { value, done } = await reader.read();
          if (done) break;
          buffer += value;
          const lines = buffer.split("\n");
          buffer = lines.pop();
          for (const l of lines) if (l.trim()) fill(JSON.parse(l));
        }
        if (buffer.trim()) fill(JSON.parse(buffer));
        for (const li of list.querySelectorAll(".waiting")) fill({ id: Object.keys(byId).find((k) => byId[k] === li) });
      } catch (err) {
        list.replaceChildren();
        note.textContent = err.message || "Something went wrong.";
      } finally {
        send.disabled = !question.value.trim();
      }
    });
  </script>
</body>
</html>
